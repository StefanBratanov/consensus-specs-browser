name: Sync snapshot

on:
  schedule:
    - cron: '17 6 * * 1'   # weekly on Mondays at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Sync snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync

      - name: Commit and push if snapshot changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add src/data/snapshot.json
          if git diff --cached --quiet; then
            echo "No changes to snapshot."
          else
            git commit -m "chore: refresh specrefs snapshot"
            git push
          fi
