<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Consensus-specs implementations</title>
    <meta name="description" content="Browse Ethereum consensus-specs entities side-by-side with their Teku, Prysm, and Lodestar implementations." />
    <script>
      // Apply the user's saved theme before React mounts so the first paint
      // doesn't flash the default. Falls back to OS preference (no attribute).
      (function () {
        try {
          var t = localStorage.getItem('theme');
          if (t === 'light' || t === 'dark') {
            document.documentElement.setAttribute('data-theme', t);
          }
        } catch (_) {}
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
