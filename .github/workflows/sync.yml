name: Sync snapshot

on:
  schedule:
    - cron: '17 6 * * *'   # daily at 06:17 UTC
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - run: npm ci

      - name: Sync snapshot
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: npm run sync

      - name: Open PR if snapshot changed
        uses: peter-evans/create-pull-request@v6
        with:
          commit-message: 'chore: refresh specrefs snapshot'
          title: 'chore: refresh specrefs snapshot'
          body: |
            Automated daily refresh of `src/data/snapshot.json` from upstream
            Teku `specrefs/` and ethereum/consensus-specs `master`.

            Review the diff to confirm only expected mappings changed before merging.
          branch: chore/sync-snapshot
          delete-branch: true
          add-paths: src/data/snapshot.json
